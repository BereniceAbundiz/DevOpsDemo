#Nombre que se mostrara en Actions
name: Integracion Continua .NET

#Disparadores : Cuando queremos que se ejecute este flujo automatizado
on:
  push:
    branches: [ "main" ] #Cualquier push a la rama main
  pull_request:
    branches: ["main"] #Cuando se hace pull a main

#Los trabajos que correran en el servidor de GitHub
jobs:
  build_and_validate:
    #Sistema operativo del servidor virtual que GitHub nos presta gratis
    runs-on: ubuntu-latest

    steps:
    #1.Clonar el repositorio dentro del servidor de GitHub
    - name: Descargar el codigo
      uses: actions/checkout@v4

    #2.Instalar el SDK de .NET para poder compilar y probar de forma nativa
    - name: Configurar entorno .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' #Aseguramos la misma version .NET del proyecto
      
    # 3. Restaurar dependencias de Nuget
    - name: Restaurar dependencias
      run: dotnet restore

    # 4. Compilar la app en modo Release para buscar errores en el codigo
    - name: Compilar proyecto
      run: dotnet build --no-restore --configuration Release

    #5. Intentar construir la img de Docker para valida que Dockerfile funciona
    - name: Construir imagen Docker
      run: |
        docker build -t devops-demo-api:test .

    # COMO MI USUARIO Y MI REPOSITORIO TIENE MAYUSCULAS: Convertir el nombre del repositorio a minúsculas
    - name: Preparar nombre del repositorio en minúsculas
      id: prep_repo
      run: |
        echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    #Iniciar sesion en el registro de contenedores de GitHub
    - name: Iniciar sesion en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }} #nombre de usuario
        password: ${{ secrets.GITHUB_TOKEN }} #Token automatico

    # Construir y publicar la imagen de Docker 
    #El formato del nombre se construye automaticamente con github.repository
    - name: Construir y publicar imagen
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true #Le dice que la suba al registro una vez construida
        tags: |
          ghcr.io/${{ env.repo_lowercase }}:latest
          ghcr.io/${{ env.repo_lowercase }}:${{ github.sha }} 
          

