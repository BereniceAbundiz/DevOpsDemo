#Nombre que se mostrara en Actions
name: Integracion Continua .NET

#Disparadores : Cuando queremos que se ejecute este flujo automatizado
on:
  push:
    branches: [ "main" ] #Cualquier push a la rama main
  pull_request:
    branches: ["main"] #Cuando se hace pull a main

#Los trabajos que correran en el servidor de GitHub
jobs:
  build_and_validate:
    #Sistema operativo del servidor virtual que GitHub nos presta gratis
    runs-on: ubuntu-latest

    steps:
    #1.Clonar el repositorio dentro del servidor de GitHub
    - name: Descargar el codigo
      uses: actions/checkout@v4

    #2.Instalar el SDK de .NET para poder compilar y probar de forma nativa
    - name: Configurar entorno .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' #Aseguramos la misma version .NET del proyecto
      
    # 3. Restaurar dependencias de Nuget
    - name: Restaurar dependencias
      run: dotnet restore

    # 4. Compilar la app en modo Release para buscar errores en el codigo
    - name: Compilar proyecto
      run: dotnet build --no-restore --configuration Release

    #5. Intentar construir la img de Docker para valida que Dockerfile funciona
    - name: Construir imagen Docker
      run: |
        docker build -t devops-demo-api:test .

